{% load i18n %}

<td class="document-actions-cell">
    <div class="document-actions">
        <a href="{{ report_url }}"
           class="button button-small button-secondary">
            {% trans "Reports" %}
        </a>

        {% for action in actions %}
            <a href="{{ action.url }}"
               class="button button-small button-secondary">
                {{ action.label }}
            </a>
        {% endfor %}

        {% for website in websites %}
            <a href="{{ website.url }}"
               class="button button-small button-secondary"
               target="_blank"
               rel="noopener noreferrer">
                {% if website.label == "PUBLIC" %}
                    {% trans "Public" %}
                {% else %}
                    QA
                {% endif %}
            </a>
        {% endfor %}
    </div>
</td>
