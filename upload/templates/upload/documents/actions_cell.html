{% load i18n wagtailadmin_tags %}
{% trans "Open document" as open_document_label %}

<td class="document-actions-cell">
    <div class="document-actions">
        <a href="{% url 'wagtailsnippets_upload_package:inspect' instance.pk %}" class="button button-secondary button--icon" title="{{ open_document_label }}" aria-label="{{ open_document_label }}">
            {% icon name="doc-full" %} {% trans "Open" %}
        </a>

        {% for action in actions %}
            <a href="{{ action.url }}" class="button button-secondary button--icon" title="{{ action.label }}" aria-label="{{ action.label }}">
                {% icon name=action.icon_name %} {% include "upload/documents/action_label.html" %}
            </a>
        {% endfor %}
    </div>
</td>
